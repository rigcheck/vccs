name: Build VCCS PKG

# Builds the VCCS app (.pkg) and the background plugin (.prx) with the OpenOrbis
# PS4 Toolchain on a GitHub-hosted Linux runner.
#
# Run it: push to main/master, open a PR, push a tag like v1.0.0 (also publishes a
# GitHub Release with the files), or use Actions -> Build VCCS PKG -> Run workflow.
#
# If the toolchain download step cannot pick the right release file on its own, run
# the workflow manually and paste a direct link to the toolchain's Linux archive
# into "toolchain_url".

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      toolchain_url:
        description: "Optional direct URL to an OpenOrbis toolchain archive (.zip / .tar.gz) for Linux"
        required: false
        default: ""

permissions:
  contents: write # only used to attach files to a Release on v* tags

jobs:
  host-tests:
    name: Logic tests (no SDK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate project folder
        id: loc
        run: |
          set -euo pipefail
          f="$(find . -name vccs_plugin.c -path '*plugin*' -not -path './.git/*' -print -quit)"
          if [ -z "$f" ]; then
            echo "::error::plugin/vccs_plugin.c not found. Files in repo:"; find . -maxdepth 3 -not -path './.git/*' | head -60; exit 1
          fi
          dir="$(cd "$(dirname "$f")/.." && pwd)"
          echo "Project folder: $dir"; ls -la "$dir"
          grep -q '^host-test:' "$dir/Makefile" || { echo "::error::$dir/Makefile has no host-test target (old or damaged Makefile) - re-upload Makefile from the latest archive"; exit 1; }
          echo "PROJECT_DIR=$dir" >> "$GITHUB_ENV"
      - name: Run host tests
        working-directory: ${{ env.PROJECT_DIR }}
        run: make host-test

  build:
    name: Build .pkg and .prx
    needs: host-tests
    runs-on: ubuntu-latest
    env:
      # PkgTool.Core targets an older .NET; let it run on the runtime installed below
      DOTNET_ROLL_FORWARD: Major
      DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Locate project folder
        id: loc
        run: |
          set -euo pipefail
          f="$(find . -name vccs_plugin.c -path '*plugin*' -not -path './.git/*' -print -quit)"
          if [ -z "$f" ]; then
            echo "::error::plugin/vccs_plugin.c not found. Files in repo:"; find . -maxdepth 3 -not -path './.git/*' | head -60; exit 1
          fi
          dir="$(cd "$(dirname "$f")/.." && pwd)"
          echo "Project folder: $dir"; ls -la "$dir"
          grep -q '^host-test:' "$dir/Makefile" || { echo "::error::$dir/Makefile has no host-test target (old or damaged Makefile) - re-upload Makefile from the latest archive"; exit 1; }
          echo "PROJECT_DIR=$dir" >> "$GITHUB_ENV"

      - name: Install clang, lld, unzip
        run: sudo apt-get update && sudo apt-get install -y clang lld unzip

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Download OpenOrbis PS4 Toolchain
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_URL: ${{ github.event.inputs.toolchain_url }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/oo"
          mkdir -p "$work/tc"
          cd "$work"

          url="${INPUT_URL:-}"
          if [ -z "$url" ]; then
            gh api repos/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/latest \
              --jq '.assets[] | "\(.name)\t\(.browser_download_url)"' | tee assets.txt
            # prefer an asset whose name mentions linux, otherwise any archive
            url="$(grep -i 'linux' assets.txt | head -n1 | cut -f2 || true)"
            if [ -z "$url" ]; then
              url="$(grep -i -E '\.(zip|tar\.gz|tgz|tar\.xz)[[:space:]]' assets.txt | head -n1 | cut -f2 || true)"
            fi
          fi
          if [ -z "$url" ]; then
            echo "::error::Could not find a toolchain archive. Re-run the workflow manually and set toolchain_url."
            exit 1
          fi
          echo "Downloading $url"
          curl -fsSL -o toolchain.archive "$url"
          case "$url" in
            *.zip) unzip -q toolchain.archive -d tc ;;
            *)     tar -xf toolchain.archive -C tc ;;
          esac

          linkx="$(find tc -name link.x -print -quit)"
          if [ -z "$linkx" ]; then
            echo "::error::link.x not found in the downloaded archive - this does not look like the toolchain. Set toolchain_url."
            exit 1
          fi
          root="$(cd "$(dirname "$linkx")" && pwd)"
          if [ ! -d "$root/bin/linux" ]; then
            echo "::error::$root/bin/linux is missing - the archive has no Linux tools. Set toolchain_url to the Linux build."
            exit 1
          fi
          chmod -R +x "$root/bin" || true
          echo "OO_PS4_TOOLCHAIN=$root" >> "$GITHUB_ENV"
          ls "$root" "$root/bin/linux"

      - name: Find right.sprx shipped with the toolchain
        run: |
          set -euo pipefail
          f="$(find "$OO_PS4_TOOLCHAIN" -name right.sprx -print -quit)"
          if [ -z "$f" ]; then
            echo "::error::right.sprx not found inside the toolchain."
            exit 1
          fi
          echo "RIGHT_SPRX=$f" >> "$GITHUB_ENV"

      - name: Build app PKG
        working-directory: ${{ env.PROJECT_DIR }}
        run: make RIGHT_SPRX="$RIGHT_SPRX"

      - name: Build background plugin
        working-directory: ${{ env.PROJECT_DIR }}
        run: make plugin

      - name: Show toolchain headers on failure (for debugging)
        if: failure()
        run: |
          inc="$OO_PS4_TOOLCHAIN/include/orbis"
          echo "=== video constants"; grep -rhn "ORBIS_VIDEO_OUT_" "$inc/_types/video.h" | head -80
          echo "=== VideoOut.h prototypes"; grep -hn "sceVideoOut" "$inc/VideoOut.h" | head -60
          echo "=== Pad.h"; grep -hn "scePad\|OrbisPadColor\|ORBIS_PAD_BUTTON" "$inc/Pad.h" "$inc/_types/pad.h" 2>/dev/null | head -80
          echo "=== UserService"; grep -hn "LoginUserIdList\|GetInitialUser\|UserId" "$inc/UserService.h" "$inc/_types/user.h" 2>/dev/null | head -30
          echo "=== libkernel"; grep -rhn "sceKernelMkdir\|sceKernelAllocateDirectMemory\|sceKernelMapDirectMemory\|sceKernelUsleep\|sceKernelGetProcessTime\|scePthreadCreate" "$inc" | head -20

      - name: Collect output
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp pkg/*.pkg dist/
          cp build/vccs_plugin.prx dist/
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: vccs-pkg-and-plugin
          path: ${{ env.PROJECT_DIR }}/dist/*
          if-no-files-found: error

      - name: Attach to GitHub Release (v* tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.PROJECT_DIR }}/dist/*
